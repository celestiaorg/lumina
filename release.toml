# release.toml — config for the `cargo xtask` release tooling.
#
# Read from the repo root by the release tool. Everything here is optional; a
# crate-only workspace could omit the file entirely.

[defaults]
# Fallback for `prepare-release`'s --branch-prefix when not passed/prompted.
# Release branches are named "<prefix><version>" (e.g. release-1.1.0).
branch_prefix = "release-"

# Published npm packages (publish targets only). Lumina publishes one component:
#   - lumina-node-wasm : generated by `wasm-pack build node-wasm` (the wasm-bindgen crate)
#   - lumina-node      : the JS wrapper in node-wasm/js/, depends on lumina-node-wasm
# The wasm crate directory is derived as the parent of `package_dir` (node-wasm).
[[npm]]
wasm_crate  = "lumina-node-wasm"
package_dir = "node-wasm/js"
