[package]
name = "xtask"
description = "In-house release tooling for the lumina workspace (cargo xtask prepare-release / release)."
version.workspace = true
edition.workspace = true
# The lumina `[workspace.package]` table only defines `version` and `edition`,
# so the remaining metadata is set here directly. `xtask` is never published.
license = "Apache-2.0"
authors = ["Celestia <contact@celestia.org>"]
repository = "https://github.com/celestiaorg/lumina"
homepage = "https://www.celestia.org"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

# Dependencies are added by each wave's Integration agent from the module
# Builders' declared stitch-point needs (see release-spec/IMPLEMENTATION-GUIDE.md §8.4).
[dependencies]
# Wave 1 stitch points (declared by M1-M8 Builders):
anyhow = "1"                                          # M1,M4,M5,M6,M7,M8
serde = { version = "1", features = ["derive"] }      # M1 (workspace serde lacks `derive`)
serde_json = "1"                                       # M7
toml = "0.8"                                          # M1
semver = "1"                                          # M3,M7
cargo_metadata = "0.18"                               # M2
ureq = { version = "2", features = ["json"] }         # M7
base64 = "0.22"                                       # M7 (GitHub-signed commit file contents)
toml_edit = "0.22"                                    # M12 (format-preserving version bump)
clap = { version = "4", features = ["derive"] }       # M14
git-cliff-core = { version = "2", default-features = false }  # M9 (changelog rendering engine)
regex = "1"                                           # M9 (git-cliff commit parsers)
tera = "1"                                            # M11 (release-plz PR-body template)

[dev-dependencies]
tempfile = "3"                                        # M5 (hermetic gitops tests)
