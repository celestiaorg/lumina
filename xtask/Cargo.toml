[package]
name = "xtask"
description = "In-house release tooling for the lumina workspace (cargo xtask prepare-release / release)."
version.workspace = true
edition.workspace = true
# The lumina `[workspace.package]` table only defines `version` and `edition`,
# so the remaining metadata is set here directly. `xtask` is never published.
license = "Apache-2.0"
authors = ["Celestia <contact@celestia.org>"]
repository = "https://github.com/celestiaorg/lumina"
homepage = "https://www.celestia.org"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# Shared crates use the workspace versions so xtask never diverges from the rest
# of the tree; the tool-only deps below are xtask's alone.
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }   # workspace serde lacks `derive`
serde_json.workspace = true
base64.workspace = true                               # GitHub-signed commit file contents
toml = "0.8"
semver = "1"
cargo_metadata = "0.18"
ureq = { version = "2", features = ["json"] }
toml_edit = "0.22"                                    # format-preserving version bump
clap = { version = "4", features = ["derive"] }
git-cliff-core = { version = "2", default-features = false }  # changelog rendering engine
regex = "1"
tera = "1"                                            # PR-body template

[dev-dependencies]
tempfile = "3"                                        # hermetic gitops tests
