[package]
name = "celestia-fibre"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Client library for the Celestia Fibre data availability protocol"
authors = ["Celestia <contact@celestia.org>"]
homepage = "https://www.celestia.org"
repository = "https://github.com/celestiaorg/lumina"
rust-version = "1.88"

[dependencies]
celestia-grpc.workspace = true
celestia-proto = { workspace = true, features = ["tonic"] }
celestia-types.workspace = true
rsema1d.workspace = true

# Crypto
k256 = { workspace = true, features = ["ecdsa"] }
ed25519-dalek = { version = "3", features = ["digest"] }
sha2.workspace = true
rand.workspace = true
chacha8rand = "0.1.2"

# Async runtime
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
futures.workspace = true
lumina-utils = { workspace = true, features = ["executor"] }

# gRPC
der = { version = "0.8", features = ["derive", "std"] }
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
http.workspace = true
tokio-rustls = { version = "0.26.1", default-features = false, features = ["logging"] }
tonic = { workspace = true, features = ["codegen"] }
tower = { version = "0.5.2", features = ["util"] }
x509-parser = "0.18"
prost.workspace = true
tendermint-proto.workspace = true

# Error handling and utilities
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
async-trait.workspace = true
bytes.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "rt"] }
# Native-only so `tls-*` features never reach wasm32, where only `ring` builds.
rustls = { version = "0.23.27", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { workspace = true, features = ["websocket"] }
ring = { version = "0.17.14", features = ["wasm32_unknown_unknown_js"] }
tokio-rustls = { version = "0.26.1", default-features = false, features = ["ring"] }
rustls-pki-types = { workspace = true, features = ["web"] }
send_wrapper.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
celestia-proto = { workspace = true, features = ["tonic-server"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["service"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
criterion.workspace = true

[[bench]]
name = "fibre_bench"
harness = false

[features]
default = ["tls-ring"]
# Use `ring` as the `rustls` crypto provider on native targets. wasm32 always uses `ring`.
tls-ring = ["rustls/ring"]
# Use `aws-lc-rs` as the `rustls` crypto provider on native targets. Wins over `tls-ring` if both are enabled.
tls-aws-lc = ["rustls/aws_lc_rs"]
