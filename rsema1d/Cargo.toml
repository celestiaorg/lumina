[package]
license = "Apache-2.0"
description = "Reed-Solomon erasure coding with Merkle commitments and Random Linear Combinations"
name = "rsema1d"
version.workspace = true
edition = "2021"
rust-version = "1.88"

[lib]
name = "rsema1d"
path = "src/lib.rs"

[features]
bench-internals = []

[dependencies]
reed-solomon-simd = "3.1.0"
bytes.workspace = true
sha2 = { workspace = true, features = ["asm"] }
thiserror.workspace = true
rayon = "1.10"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex.workspace = true
num_cpus = "1.17"

[target.'cfg(target_os = "linux")'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
rand.workspace = true
rand_chacha = "0.3.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[[bench]]
name = "codec_bench"
harness = false

[[bench]]
name = "derive_bench"
harness = false

[[bench]]
name = "rlc_bench"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "reconstruct_sweep"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom_02.workspace = true
wasm-bindgen-test.workspace = true
