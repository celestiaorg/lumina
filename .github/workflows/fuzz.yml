name: Fuzz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds to fuzz each target
        default: '300'

permissions:
  contents: read

jobs:
  # Both architectures: reed-solomon-simd, sha2 and the RLC kernels each dispatch to arch-specific code.
  rsema1d:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: [rlc, verify, reconstruct, rlc_large]
        include:
          # See the target's header for why it runs without a sanitizer.
          - target: rlc_large
            sanitizer: none

    steps:
    - uses: actions/checkout@v4

    - name: Setup toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        cache-key: fuzz-${{ matrix.target }}-${{ runner.arch }}
        cache-workspaces: rsema1d/fuzz
        rustflags: ""

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    # reed-solomon-simd must take its AVX2 engine, as in production.
    - name: Check CPU features (x86_64)
      if: runner.arch == 'X64'
      run: grep -m1 '^flags' /proc/cpuinfo | tee /dev/stderr | grep -qw avx2

    # Without SHA3 (EOR3), RLCs skip the PMULL kernels and take the generic path.
    - name: Check CPU features (aarch64)
      if: runner.arch == 'ARM64'
      run: grep -m1 '^Features' /proc/cpuinfo | tee /dev/stderr | grep -qw sha3

    # The corpus is shared across architectures; only the save key is per-arch so they don't collide.
    - name: Restore corpus
      uses: actions/cache/restore@v4
      with:
        path: rsema1d/fuzz/corpus/${{ matrix.target }}
        key: rsema1d-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ runner.arch }}
        restore-keys: rsema1d-fuzz-corpus-${{ matrix.target }}-

    # cargo-fuzz defaults --target to the triple it was built for, and the installed x86_64 binary
    # is a musl build, where ASan can't link; pass the runner's own host triple instead.
    - name: Fuzz
      run: |
        cargo fuzz run --fuzz-dir rsema1d/fuzz -O --target "$(rustc -vV | sed -n 's/^host: //p')" -s ${{ matrix.sanitizer || 'address' }} ${{ matrix.target }} -- -max_total_time=${{ inputs.max_total_time || 300 }}

    - name: Save corpus
      if: always()
      uses: actions/cache/save@v4
      with:
        path: rsema1d/fuzz/corpus/${{ matrix.target }}
        key: rsema1d-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ runner.arch }}

    - name: Upload crashes
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rsema1d-fuzz-${{ matrix.target }}-${{ runner.arch }}-artifacts
        path: rsema1d/fuzz/artifacts/${{ matrix.target }}

  types:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - extended_header
          - shwap_ids
          - sample
          - row
          - namespace_data
          - share_proof
          - namespace
          - sample_structured
          - row_structured
          - namespace_data_structured
          - share_proof_structured
          - eds_raw_structured
          - header_verify
        include:
          # Needs room for the widest square.
          - target: eds
            args: -max_len=131072

    steps:
    - uses: actions/checkout@v4

    - name: Setup toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        cache-key: fuzz-types-${{ matrix.target }}
        cache-workspaces: types/fuzz
        rustflags: ""

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    - name: Restore corpus
      uses: actions/cache/restore@v4
      with:
        path: types/fuzz/corpus/${{ matrix.target }}
        key: types-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: types-fuzz-corpus-${{ matrix.target }}-

    - name: Seed corpus
      run: cargo run --manifest-path types/fuzz/Cargo.toml --example seed_corpus

    # See the rsema1d job's Fuzz step.
    - name: Fuzz
      run: |
        cargo fuzz run --fuzz-dir types/fuzz -O --target "$(rustc -vV | sed -n 's/^host: //p')" -s address ${{ matrix.target }} -- -max_total_time=${{ inputs.max_total_time || 300 }} ${{ matrix.args }}

    - name: Save corpus
      if: always()
      uses: actions/cache/save@v4
      with:
        path: types/fuzz/corpus/${{ matrix.target }}
        key: types-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

    - name: Upload crashes
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: types-fuzz-${{ matrix.target }}-artifacts
        path: types/fuzz/artifacts/${{ matrix.target }}
