name: Fuzz
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # x86_64, so reed-solomon-simd takes its AVX2 engine; aarch64 code is covered by the CI arm job.
  rsema1d:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [rlc, verify, reconstruct]
        sanitizer: [address]
        include:
          # See the target's header for why it runs without a sanitizer.
          - target: rlc_large
            sanitizer: none

    steps:
    - uses: actions/checkout@v4

    - name: Setup toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        cache-key: fuzz-${{ matrix.target }}
        cache-workspaces: rsema1d/fuzz
        rustflags: ""

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-fuzz

    - name: Check CPU features
      run: grep -m1 '^flags' /proc/cpuinfo | tee /dev/stderr | grep -qw avx2

    - name: Restore corpus
      uses: actions/cache/restore@v4
      with:
        path: rsema1d/fuzz/corpus/${{ matrix.target }}
        key: rsema1d-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: rsema1d-fuzz-corpus-${{ matrix.target }}-

    - name: Fuzz
      run: cargo fuzz run --fuzz-dir rsema1d/fuzz -O -s ${{ matrix.sanitizer }} ${{ matrix.target }} -- -max_total_time=1200

    - name: Save corpus
      if: always()
      uses: actions/cache/save@v4
      with:
        path: rsema1d/fuzz/corpus/${{ matrix.target }}
        key: rsema1d-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

    - name: Upload crashes
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: rsema1d-fuzz-${{ matrix.target }}-artifacts
        path: rsema1d/fuzz/artifacts/${{ matrix.target }}
