[package]
name = "fibre-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace: keep this crate out of the parent lumina workspace.
[workspace]

[dependencies]
celestia-fibre = { path = "../fibre" }
celestia-grpc = { path = "../grpc", features = ["tls-ring"] }
celestia-proto = { path = "../proto", features = ["tonic"] }
celestia-types = { path = "../types" }

clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
k256 = "0.13"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = "0.3"
